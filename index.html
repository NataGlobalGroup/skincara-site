<title>Skincara — Under Maintenance</title>

<meta name="description" content="The Skincara website is getting a makeover. We'll be back soon.">

<style>
/* Same tokens as the Skincara site */
:root{
  --brand:#FF5050;
  --on-brand:#FFFFFF;
  --display:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --maxw:1240px;
}
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--brand);color:var(--on-brand);font-family:var(--body);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;
}
a{color:inherit}
img{display:block}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
@media (max-width:480px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

header .wrap{padding-block:22px;display:flex;justify-content:center}
.logo{height:24px;width:auto}

main{flex:1}
.hero{padding-block:clamp(20px,3.5vw,48px) clamp(24px,3.5vw,40px);text-align:center}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.78);margin-bottom:20px}
h1{margin:0 auto;font:300 clamp(30px,5.25vw,78px)/1.02 var(--display);letter-spacing:-.035em;text-wrap:balance;max-width:14ch;color:var(--on-brand)}
.lede{margin:28px auto 0;font-size:clamp(18px,2vw,22px);line-height:1.45;max-width:34ch}
.lede-id{margin:8px auto 0;font-size:15px;opacity:.78;max-width:48ch;text-wrap:balance}

.game{width:100%;max-width:800px;margin:0 auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
canvas{width:100%;height:auto;display:block;cursor:pointer;image-rendering:pixelated}
.controls{display:none;gap:12px;margin-top:12px;justify-content:center}
@media (hover:none) and (pointer:coarse){.controls{display:flex}}

.pill{display:inline-flex;align-items:center;gap:12px;padding:12px 24px;border-radius:999px;font:500 15px/1 var(--body);text-decoration:none;border:1.5px solid var(--on-brand);color:var(--on-brand);background:none;cursor:pointer;transition:background .2s,color .2s}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill:hover{background:var(--on-brand);color:var(--brand)}
.pill:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--on-brand);outline-offset:3px}

footer .wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding-block:32px}
footer .eyebrow{margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height, GROUND = 200, PX = 3;
  var BRAND = '#FF5050', WHITE = '#FFFFFF';
  var MONO = '"JetBrains Mono", ui-monospace, Menlo, monospace';
  try { if (document.fonts) document.fonts.load('500 12px "JetBrains Mono"'); } catch (e) {}

  // ---------- Pixel sprites: '#' = white, 'o' = cut-out (background), '.' = empty ----------
  var PRINCESS_HEAD = [
    "...#..##..#...",
    "...########...",
    "..##########..",
    "..###########.",
    "..######o####.",
    "..###########.",
    "..##########..",
    "..###.#####...",
    "..###.####....",
    "...########...",
    "....######....",
    "....#oooo#....",
    "....######....",
    "...########...",
    "..##########..",
    ".############.",
    "##############"
  ];
  var LEGS_STAND = ["....##..##....", "....##..##....", "....##..##....", "...###..###..."];
  var LEGS_A     = ["....##..##....", "....##..###...", "....##........", "....###......."];
  var LEGS_B     = ["....##..##....", "...###..##....", "........##....", "........###..."];
  var PRINCESS = {
    stand: PRINCESS_HEAD.concat(LEGS_STAND),
    a: PRINCESS_HEAD.concat(LEGS_A),
    b: PRINCESS_HEAD.concat(LEGS_B),
    duck: [
      "...#..##..#...",
      "...########...",
      "..##########..",
      "..######o####.",
      "..###########.",
      "..##########..",
      "..##########..",
      "...########...",
      ".############.",
      "##############",
      "...##....##...",
      "..###...###..."
    ]
  };

  var TREE_SMALL = [
    "...#####...",
    "..#######..",
    ".##o######.",
    ".#######o#.",
    "..#######..",
    "...##o##...",
    ".....#.....",
    ".....#.....",
    ".....#.....",
    "....###...."
  ];
  var TREE_TALL = [
    "...#####...",
    "..#######..",
    ".###o#####.",
    ".#########.",
    ".####o####.",
    ".#o#######.",
    ".#########.",
    "..###o###..",
    "...#####...",
    ".....#.....",
    ".....#.....",
    ".....#.....",
    ".....#.....",
    "....###...."
  ];

  var BUTTERFLY = [
    [
      "..##......##..",
      ".####....####.",
      ".##o#.##.#o##.",
      "..###.##.###..",
      "...##.##.##...",
      "......##......",
      "......##......"
    ],
    [
      "......##......",
      "..##..##..##..",
      ".##o#.##.#o##.",
      ".####.##.####.",
      "..##..##..##..",
      "......##......"
    ]
  ];

  function sprW(s) { return s[0].length * PX; }
  function sprH(s) { return s.length * PX; }
  function drawSprite(s, x, y) {
    x = Math.round(x); y = Math.round(y);
    for (var r = 0; r < s.length; r++) {
      for (var c = 0; c < s[r].length; c++) {
        var ch = s[r][c];
        if (ch === '.') continue;
        ctx.fillStyle = ch === '#' ? WHITE : BRAND;
        ctx.fillRect(x + c * PX, y + r * PX, PX, PX);
      }
    }
  }

  // ---------- Game ----------
  var hi = 0;
  try { hi = parseInt(localStorage.getItem('skincara_hi') || '0', 10) || 0; } catch (e) {}
  function pad(n) { return String(Math.floor(n)).padStart(5, '0'); }

  var state = 'idle'; // idle | running | over
  var p, obstacles, speed, score, frame, nextSpawn;

  function reset() {
    p = { x: 60, y: GROUND, vy: 0, duck: false };
    obstacles = []; speed = 5.2; score = 0; frame = 0; nextSpawn = 60;
  }
  reset();

  function onGround() { return p.y >= GROUND; }
  function jump() {
    if (state === 'idle') state = 'running';
    if (state === 'over') { if (frame > 20) { reset(); state = 'running'; } return; }
    if (onGround() && !p.duck) p.vy = -12.8;
  }
  function duck(on) {
    if (state !== 'running') return;
    p.duck = on;
    if (on && !onGround()) p.vy = Math.max(p.vy, 9);
  }

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
    if (e.code === 'ArrowDown') { e.preventDefault(); duck(true); }
  });
  document.addEventListener('keyup', function (e) { if (e.code === 'ArrowDown') duck(false); });
  cv.addEventListener('pointerdown', function (e) { e.preventDefault(); jump(); });
  var bj = document.getElementById('btnJump'), bd = document.getElementById('btnDuck');
  bj.addEventListener('pointerdown', function (e) { e.preventDefault(); jump(); });
  bd.addEventListener('pointerdown', function (e) { e.preventDefault(); duck(true); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { bd.addEventListener(ev, function () { duck(false); }); });

  function spawn() {
    var r = Math.random();
    if (r < .6 || score < 150) {
      var spr = Math.random() < .5 ? TREE_SMALL : TREE_TALL;
      var n = (Math.random() < .3 && score > 300) ? 2 : 1;
      obstacles.push({ type: 'tree', x: W + 20, spr: spr, n: n, w: sprW(spr) * n + (n - 1) * PX, h: sprH(spr) });
    } else {
      var low = Math.random() < .5;
      obstacles.push({ type: 'fly', x: W + 20, w: sprW(BUTTERFLY[0]), h: 7 * PX, top: GROUND - (low ? 28 : 62), ph: 0 });
    }
    nextSpawn = 55 + Math.random() * 60 + (speed < 8 ? 25 : 0);
  }

  function hit(o) {
    var ph = p.duck ? sprH(PRINCESS.duck) : sprH(PRINCESS.stand);
    var pb = { l: p.x + 9, r: p.x + sprW(PRINCESS.stand) - 9, t: p.y - ph + 6, b: p.y };
    var ob;
    if (o.type === 'tree') ob = { l: o.x + 6, r: o.x + o.w - 6, t: GROUND - o.h + 9, b: GROUND };
    else ob = { l: o.x + 5, r: o.x + o.w - 5, t: o.top + 5, b: o.top + o.h - 4 };
    return pb.l < ob.r && pb.r > ob.l && pb.t < ob.b && pb.b > ob.t;
  }

  function update() {
    frame++;
    if (state !== 'running') return;
    score += speed * .08; speed = Math.min(12, speed + .0015);
    p.vy += .68; p.y += p.vy;
    if (p.y > GROUND) { p.y = GROUND; p.vy = 0; }
    if (--nextSpawn <= 0) spawn();
    for (var i = obstacles.length - 1; i >= 0; i--) {
      var o = obstacles[i];
      o.x -= speed * (o.type === 'fly' ? 1.15 : 1);
      if (o.type === 'fly') o.ph += 1;
      if (o.x < -120) obstacles.splice(i, 1);
      else if (hit(o)) {
        state = 'over'; frame = 0;
        if (score > hi) { hi = Math.floor(score); try { localStorage.setItem('skincara_hi', String(hi)); } catch (e) {} }
      }
    }
  }

  function drawPrincess() {
    var s;
    if (p.duck) s = PRINCESS.duck;
    else if (state === 'running' && onGround()) s = (Math.floor(frame / 6) % 2) ? PRINCESS.a : PRINCESS.b;
    else s = PRINCESS.stand;
    drawSprite(s, p.x, p.y - sprH(s));
  }

  function drawGround() {
    ctx.fillStyle = WHITE;
    ctx.fillRect(0, GROUND, W, PX);
    var off = state === 'running' ? frame * speed : 0;
    for (var i = 0; i < 18; i++) {
      var gx = (((i * 61 + 13) * 3 - off * .9) % (W + 60) + (W + 60)) % (W + 60) - 30;
      var gw = (3 + (i * 7) % 5) * PX;
      ctx.fillRect(Math.round(gx), GROUND + PX * (2 + (i % 3)), gw, PX);
    }
  }

  var TOUCH = false;
  try { TOUCH = window.matchMedia('(hover: none) and (pointer: coarse)').matches; } catch (e) {}
  var K = TOUCH ? 1.7 : 1;
  function text(str, x, y, size, weight, align, spacing) {
    size = Math.round(size * K);
    ctx.font = (weight || 500) + ' ' + size + 'px ' + MONO;
    ctx.textAlign = align;
    try { ctx.letterSpacing = (spacing || 0) + 'px'; } catch (e) {}
    ctx.fillText(str, x, y);
  }

  function draw() {
    ctx.fillStyle = BRAND; ctx.fillRect(0, 0, W, H);
    drawGround();
    obstacles.forEach(function (o) {
      if (o.type === 'tree') {
        for (var i = 0; i < o.n; i++) drawSprite(o.spr, o.x + i * (sprW(o.spr) + PX), GROUND - o.h);
      } else {
        drawSprite(BUTTERFLY[Math.floor(o.ph / 8) % 2], o.x, o.top);
      }
    });
    drawPrincess();

    ctx.fillStyle = WHITE; ctx.textBaseline = 'top';
    text((hi ? 'HI ' + pad(hi) + '  ' : '') + pad(score), W - 8, 14, 13, 500, 'right', 1.5);

    ctx.textBaseline = 'alphabetic';
    if (state === 'idle') {
      text(TOUCH ? 'TAP TO START' : 'PRESS SPACE TO START', W / 2, 100, 14, 500, 'center', 2.5);
    } else if (state === 'over') {
      text('GAME OVER', W / 2, 92, 26, 500, 'center', 5);
      text(TOUCH ? 'TAP TO RETRY' : 'PRESS SPACE TO RETRY', W / 2, 126, 12, 400, 'center', 2.5);
    }
  }

  function loop() { update(); draw(); requestAnimationFrame(loop); }
  loop();
})();
</script>
</body>
</html>
